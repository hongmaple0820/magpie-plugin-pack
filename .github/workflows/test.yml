name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # magpie-hud 声明了运行时依赖（fzstd，zstd 解压），测试要真装：
      # lib/truth/frames.mjs 静态 import 它，缺包时入口链直接崩。
      - name: Install dependencies
        run: npm ci
      - name: Run all plugin tests
        run: npm test
      # 契约检查：测试跑夹具，这两条跑「真实的会话目录」与「真实的发布包」。
      # 前者证不了「用户机器上不会冒出无来源状态」，后者证不了「装完能不能跑」。
      - name: HUD contract checks
        working-directory: plugins/magpie-hud
        run: |
          node tools/check/honesty.mjs
          node tools/check/packaging.mjs
