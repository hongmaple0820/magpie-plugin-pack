# 构建鹊楼桌面 HUD 的三平台产物。
#
# 为什么需要 CI：macOS 的二进制必须在 macOS 上链接（Rust 也不解决交叉链接 macOS SDK）。
# 本地 Windows 只能出 Windows 产物；这份工作流让 tag 一推就有三平台产物。
name: hud-native

on:
  push:
    tags: ["hud-v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            out: magpie-hud-native.exe
          - os: macos-14
            target: aarch64-apple-darwin
            out: magpie-hud-native
          - os: macos-13
            target: x86_64-apple-darwin
            out: magpie-hud-native
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            out: magpie-hud-native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: plugins/magpie-hud/desktop-rust
        run: cargo build --release --target ${{ matrix.target }}
      # 运行时 desktopBinary() 只在 desktop-rust/ 根找二进制，而 cargo 把产物放在
      # target/<target>/release/ 下——中间没人搬，下载的 artifact 直接装进插件也是
      # 「no binary」。这一步把产物放到「解开就能用」的位置：下载后覆盖
      # plugins/magpie-hud/desktop-rust/ 即可被找到。
      - name: stage for runtime lookup
        shell: bash
        run: |
          src="plugins/magpie-hud/desktop-rust/target/${{ matrix.target }}/release/${{ matrix.out }}"
          dst="plugins/magpie-hud/desktop-rust/${{ matrix.out }}"
          test -f "$src"
          cp "$src" "$dst"
          ls -l "$dst"
      - uses: actions/upload-artifact@v4
        with:
          name: hud-${{ matrix.target }}
          path: plugins/magpie-hud/desktop-rust/${{ matrix.out }}
          if-no-files-found: error

  # tag 一推就把东西发出去：npm tarball 附到 Release，三平台二进制也各附一份。
  #
  # 只有 Windows 的 exe 放进 tarball：macOS 的 aarch64 与 x86_64 产物同名
  # （都是 magpie-hud-native），包里只放得下一个架构——这是 §9 待定项，
  # 在那之前 macOS/Linux 的二进制单独附在 Release 里，用户自己挑架构覆盖。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/hud-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: stage windows exe into the package
        run: |
          src=artifacts/hud-x86_64-pc-windows-msvc/magpie-hud-native.exe
          test -f "$src"
          cp "$src" plugins/magpie-hud/desktop-rust/magpie-hud-native.exe
          ls -l plugins/magpie-hud/desktop-rust/magpie-hud-native.exe
      - name: pack the plugin
        working-directory: plugins/magpie-hud
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tgz
            artifacts/hud-*/magpie-hud-native*
